<!doctype html>
<html lang="en">
  <html>
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Unit Converter</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Orbitron:wght@400..900&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap"
        rel="stylesheet"
      />
      <link rel="stylesheet" href="index.css" />
    </head>
    <body>
      <div id="container">
        <div id="form">
          <h1>Metric/Imperial Unit Conversion</h1>
          <input id="input" value="20" />
          <button id="btn" value="20">Convert</button>
        </div>
        <div id="conversions">
          <div class="conversion">
            <h2>Length (Meter/Feet)</h2>
            <p id="length-conversion-txt"></p>
          </div>
          <div class="conversion">
            <h2>Volume (Liters/Gallons)</h2>
            <p id="volume-conversion-txt">
            </p>
          </div>
          <div class="conversion">
            <h2>Mass (Kilograms/Pounds)</h2>
            <p id="mass-conversion-txt">
            </p>
          </div>
        </div>
      </div>
      <script type="module" src="index.js"></script>
    </body>
  </html>
</html>
